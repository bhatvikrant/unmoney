<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Track income, expenses and transfers across every account. Works offline." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- home-screen app on iOS / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UnMoney" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>UnMoney</title>
    <script>
      // The chosen theme before the app mounts, so the splash, Sign in and Lock screens are dark too (src/lib/theme.ts saves it).
      try {
        var t = localStorage.getItem("unmoney:theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
      // Installed as an app: no pinch or double-tap zoom, as in a native app (the browser tab keeps zoom for accessibility).
      if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) {
        document.documentElement.classList.add("standalone");
        var vp = document.querySelector('meta[name="viewport"]');
        vp.content += ", maximum-scale=1, user-scalable=no";
        // iOS ignores user-scalable=no for pinches, and a desktop trackpad pinch arrives as a ctrl+wheel
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      }
    </script>
    <style>
      /* The boot screen, painted before any script or stylesheet arrives: on a slow first visit the bundle takes
         seconds, and without it the page is blank white (in dark mode too). React replaces it on mount; Splash in
         App.tsx draws the same mark in the same place. The mark fades in after 300 ms, so a warm start never shows it. */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; }
      #boot svg { animation: boot-in 200ms ease-out 300ms both; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.12)); }
      #boot rect { fill: #0a0a0a; }
      #boot path { fill: #fff; }
      html.dark #boot { background: #0a0a0a; }
      html.dark #boot rect { fill: #fafafa; }
      html.dark #boot path { fill: #0a0a0a; }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><svg width="56" height="56" viewBox="0 0 512 512" aria-label="UnMoney" role="img"><rect width="512" height="512" rx="112" /><path d="M128 352V160h48l80 112 80-112h48v192h-48V240l-80 112-80-112v112z" /></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
